name: Python Data Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'      # har 6 ghante (UTC)
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level'
        required: false
        default: 'INFO'
        type: choice
        options: [DEBUG, INFO, WARNING, ERROR]
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
        run: python scraper.py

      - name: Validate output
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          p = pathlib.Path("data/latest.json")
          if not p.exists():
              sys.exit("latest.json missing")
          d = json.loads(p.read_text())
          s = d["summary"]
          print(f"records={s['total_records']} ok={s['successful_sources']}/{s['total_sources']}")
          if s["successful_sources"] == 0:
              sys.exit("All sources failed")
          EOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data-${{ github.run_number }}
          path: data/
          retention-days: 30

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): refresh $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
